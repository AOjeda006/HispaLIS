# La pila: PostgreSQL + Kafka + registro de esquemas + servidor de terminología + backend + web.
#
#   docker compose -f infra/compose/docker-compose.yml up
#
# Todo lo que hace falta para recorrer el circuito de extremo a extremo desde un clon recién hecho.
# Queda fuera Keycloak, que es el ítem 34.
#
# ⚠️ Dos cosas viven FUERA del repositorio y hay que tenerlas antes de levantar:
#
#   1. La guía compilada — `npx fsh-sushi .` dentro de `ig/`. No se versiona: la produce SUSHI.
#   2. Las releases de terminología archivadas en `BibliotecaDocumentacion`, que se asume clonada
#      como carpeta hermana. Con `HISPALIS_RELEASES` se puede apuntar a otro sitio.
#
# Sin ellas, el servidor de terminología levanta y el cargador para con un mensaje que dice cuál
# falta — que es mejor que un laboratorio arrancando con un catálogo vacío.

name: hispalis

services:
  postgres:
    # 14 y no la última: es la versión con la que corren los tests del backend (PostgreSQL embebido),
    # y las dos tienen que moverse juntas. Con versiones distintas, una migración que use algo de
    # PG15 pasaría aquí y fallaría en los tests — ya ocurrió una vez, con `NULLS NOT DISTINCT`.
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: hispalis
      POSTGRES_USER: hispalis
      # Es una simulación con datos sintéticos y la base no se publica fuera de la red del compose.
      # En cualquier otro sitio esto sería un secreto, no una línea en un fichero versionado.
      POSTGRES_PASSWORD: hispalis
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      # Crea la base del servidor de terminología. Solo corre la primera vez que se inicializa el
      # volumen: sobre una pila que ya existía hay que hacer `down -v`.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hispalis -d hispalis']
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # KRaft, sin ZooKeeper: es lo que Kafka 3.9 recomienda y lo único que existe en Kafka 4.
    # La versión acompaña a la del cliente que usa el backend (§12): cliente y broker se mueven
    # juntos o el protocolo deja de entenderse.
    image: confluentinc/cp-kafka:7.9.8
    environment:
      CLUSTER_ID: hispalis-kraft-000000000
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Dos escuchas porque hay dos redes: `INTERNA` es por donde entra el backend desde dentro del
      # compose y `LOCAL` la que se publica al equipo. Con una sola, el broker anunciaría a los
      # clientes de fuera una dirección que solo existe dentro — el fallo clásico de Kafka en Docker,
      # que además no aparece al conectar sino al pedir metadatos.
      KAFKA_LISTENERS: 'INTERNA://kafka:9092,LOCAL://0.0.0.0:29092,CONTROLLER://kafka:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNA://kafka:9092,LOCAL://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNA:PLAINTEXT,LOCAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNA
      # Un solo nodo: todo lo que por defecto asume tres réplicas hay que bajarlo a una.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Los tópicos los crea `kafka-topics` con sus particiones y su retención. Con la creación
      # automática encendida, un tópico mal escrito en un cliente nacería solo, con una partición y
      # la configuración por defecto, y nadie se enteraría hasta que el orden dejara de cumplirse.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
      - '29092:29092'
    volumes:
      - datos-kafka:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'kafka:9092']
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 20

  # Los cuatro tópicos de §11, creados una vez y con su configuración explícita. Es un servicio de
  # arranque, no un demonio: crea y termina, y quien depende de él espera a que termine bien.
  kafka-topicos:
    image: confluentinc/cp-kafka:7.9.8
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -euo pipefail
        for topico in lab.peticiones.v1 lab.especimenes.v1 lab.resultados.v1 lab.informes.v1; do
          # Tres particiones para que la clave de reparto —el paciente— signifique algo: con una
          # sola, el orden saldría bien por accidente y nadie notaría que la clave está mal puesta.
          # `--if-not-exists` porque este servicio vuelve a correr en cada `up`.
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topico" --partitions 3 --replication-factor 1 \
            --config retention.ms=604800000
        done
        kafka-topics --bootstrap-server kafka:9092 --list

  registro-de-esquemas:
    image: confluentinc/cp-schema-registry:7.9.8
    environment:
      SCHEMA_REGISTRY_HOST_NAME: registro-de-esquemas
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:9092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8085'
      # Compatibilidad hacia atrás, que es lo que exige §11. Es además el valor por defecto de
      # Confluent, y se escribe igual: un contrato que depende de un valor por defecto es un
      # contrato que se pierde el día que alguien cambie la imagen.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    ports:
      - '8085:8085'
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8085/subjects']
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 20

  # ─── Terminología (D14) ────────────────────────────────────────────────────
  #
  # Un `hapi-fhir-jpaserver-starter` de serie: la imagen NO se construye. Todo lo nuestro entra por
  # la API estándar, así que este servicio es reemplazable por Snowstorm u Ontoserver cambiando la
  # URL que usan el backend, el motor y el generador — y nada más.
  # Un volumen recién creado es de `root`, y la imagen de HAPI corre sin privilegios (65532). Sin
  # esto el servidor arranca, crea sus tablas y muere al montar el índice con un
  # `AccessDeniedException: /datos/lucene` enterrado en cien líneas de traza. Se arregla aquí y no
  # con `user: root` en el servicio: darle privilegios al servidor para que pueda escribir en un
  # directorio es cambiar el problema de sitio.
  terminologia-datos:
    image: busybox:1.37
    command: ['sh', '-c', 'mkdir -p /datos/lucene && chown -R 65532:65532 /datos']
    volumes:
      - datos-terminologia:/datos

  terminologia:
    image: hapiproject/hapi:v8.10.0-3
    environment:
      # Medido: con el ajuste por defecto, el servidor muere en silencio (código 255, sin traza)
      # justo al cargar en memoria los paquetes de R5. No es un cuelgue: es que no le cabe.
      JAVA_OPTS: '-Xmx4g -Xms512m'
      HISPALIS_TERMINOLOGIA_BD: jdbc:postgresql://postgres:5432/terminologia
      HISPALIS_TERMINOLOGIA_BD_USUARIO: hispalis
      HISPALIS_TERMINOLOGIA_BD_CLAVE: hispalis
      HISPALIS_TERMINOLOGIA_PUBLICA: http://localhost:8086/fhir
    volumes:
      - ../../terminologia/hapi/application.yaml:/app/config/application.yaml:ro
      - datos-terminologia:/datos
    ports:
      - '8086:8080'
    depends_on:
      postgres:
        condition: service_healthy
      terminologia-datos:
        condition: service_completed_successfully
    # Sin `healthcheck`, y no por descuido: la imagen de HAPI es *distroless* —solo lleva `java`—,
    # así que un `test: [CMD, curl, …]` no falla por estar el servidor mal, falla por no existir
    # `curl`, y el servicio se queda «unhealthy» con el log en verde. Quien espera a la terminología
    # espera al cargador, que es además la condición correcta: lo que importa no es que el servidor
    # conteste, sino que tenga dentro el catálogo.

  # Servicio de arranque, como `kafka-topicos`: carga y termina. Quien necesita terminología espera
  # a que TERMINE BIEN, no a que el servidor conteste — un servidor levantado y vacío responde
  # `$validate-code` con «no» a todo, que es la peor forma de estar disponible.
  terminologia-carga:
    build:
      context: ../..
      dockerfile: terminologia/Dockerfile
    environment:
      HISPALIS_TERMINOLOGIA: http://terminologia:8080/fhir
      # Sin la Edición Española no se carga SNOMED y el cargador lo avisa. No se puede
      # redistribuir, así que no hay valor por defecto que pueda funcionar por accidente.
      HISPALIS_SNOMED: ${HISPALIS_SNOMED:-}
    volumes:
      # La guía compilada: lo que produce SUSHI, que no está versionado.
      - ../../ig/fsh-generated/resources:/guia:ro
      # Las releases archivadas, FUERA del repositorio y en solo lectura.
      - ${HISPALIS_RELEASES:-../../../BibliotecaDocumentacion/_fuente/_externos}:/releases:ro
    depends_on:
      terminologia:
        condition: service_started

  backend:
    build:
      # El contexto es la raíz del repositorio, compartido con la web.
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      HISPALIS_BD_URL: jdbc:postgresql://postgres:5432/hispalis
      HISPALIS_BD_USUARIO: hispalis
      HISPALIS_BD_CLAVE: hispalis
      HISPALIS_KAFKA: 'kafka:9092'
      HISPALIS_REGISTRO_ESQUEMAS: 'http://registro-de-esquemas:8085'
      HISPALIS_TERMINOLOGIA: 'http://terminologia:8080/fhir'
    ports:
      # Se publica aunque la web no lo necesite —le llega por el proxy—, porque el circuito se
      # recorre con `curl` y el validador oficial también entra por aquí.
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      # El bus NO condiciona el arranque de la API: para eso está el outbox. Lo que sí se espera es
      # a que existan los tópicos, porque si el backend arrancara antes, el relay publicaría contra
      # un tópico inexistente y se pasaría los primeros segundos reintentando para nada.
      kafka-topicos:
        condition: service_completed_successfully
      registro-de-esquemas:
        condition: service_healthy
      # La terminología SÍ condiciona el arranque, al revés que el bus: el laboratorio valida
      # códigos y resuelve `display` contra ella desde la primera escritura, y arrancar antes de
      # que esté cargada significaría publicar unos recursos con `display` y otros sin él.
      terminologia-carga:
        condition: service_completed_successfully
    healthcheck:
      # `metadata` es la prueba honesta de que está listo: contesta cuando el servidor FHIR está
      # levantado de verdad, no cuando el proceso existe.
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/fhir/metadata']
      interval: 10s
      timeout: 5s
      # HAPI JPA tarda en el primer arranque: crea su centenar de tablas y Flyway migra las nuestras.
      start_period: 120s
      retries: 30

  web:
    build:
      context: ../..
      dockerfile: web-profesional/Dockerfile
    ports:
      - '4200:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  datos-postgres:
  # El log de Kafka sobrevive a un `down`: sin volumen, parar la pila borraría lo publicado y el
  # `_schemas` del registro con ello, que es donde vive el historial de versiones de los contratos.
  datos-kafka:
  # El índice de texto completo del servidor de terminología. Vive en disco y no en la base, así
  # que sin volumen habría que reindexar en cada arranque — y hasta entonces `$expand` iría vacío.
  datos-terminologia:
