# CI de los simuladores y el generador de datos sintéticos (Python).
# Filtrado por `paths:` OBLIGATORIO (§13.1 del diseño).
name: CI · simuladores

on:
  push:
    branches: [main]
    paths:
      - 'simuladores/**'
      - '.github/workflows/ci-simuladores.yml'
      # El generador resuelve su terminología contra el servidor (D14, D15): consume el MISMO
      # catálogo que el sistema, no una lista paralela. El servidor de los tests se carga con lo que
      # produce SUSHI, así que sin esta ruta, añadir una prueba al catálogo no dispararía los tests
      # que comprueban que el generador la conoce.
      - 'ig/input/fsh/**'
      # Y los rangos de referencia del mismo modo: el generador los lee del fichero que publica el
      # laboratorio, en el árbol del backend, para sortear valores verosímiles. Sin esta ruta,
      # cambiar un rango allí no dispararía los tests que comprueban que el generador lo carga.
      - 'backend/src/main/resources/laboratorio/**'
      # Desde que el corpus se genera contra el servidor de verdad, este trabajo depende del
      # `compose` y del cargador. Sin estas dos rutas, romper el cargador dejaría el corpus sin
      # generar y el fallo aparecería en el trabajo de otro componente.
      - 'terminologia/**'
      - 'infra/compose/docker-compose.yml'
  pull_request:
    paths:
      - 'simuladores/**'
      - '.github/workflows/ci-simuladores.yml'
      - 'ig/input/fsh/**'
      - 'backend/src/main/resources/laboratorio/**'
      - 'terminologia/**'
      - 'infra/compose/docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-simuladores-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_FHIR: 5.0.0
  PAQUETE_FHIR: hl7.fhir.r5.core#5.0.0
  # El mismo nombre de variable que usan el backend, el motor y el `compose`: los cuatro resuelven
  # contra la misma autoridad, y eso tiene que verse también en la configuración. Aquí apunta al
  # puerto que el `compose` publica.
  HISPALIS_TERMINOLOGIA: http://localhost:8086/fhir

jobs:
  verificar:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # El catálogo de pruebas no está versionado: lo produce SUSHI a partir del FSH, y con él se
      # carga el servidor de terminología que levanta `tests/conftest.py`. Los tests del generador
      # fallan a propósito si falta, en vez de arrancar con un catálogo a medias, así que este paso
      # no es opcional. NO se construye la IG entera: eso es cosa de `ci-ig` y cuesta minutos,
      # mientras que los artefactos de conformidad salen en segundos.
      - name: Compilar la terminología de la guía
        working-directory: ig
        run: npx --yes fsh-sushi .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: simuladores/pyproject.toml

      - name: Instalar dependencias
        working-directory: simuladores
        run: python -m pip install -e ".[dev]"

      - name: Lint y formato
        working-directory: simuladores
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        working-directory: simuladores
        run: pytest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar el validador oficial de HL7
        run: |
          curl -sSL -o validator_cli.jar \
            https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar

      # Desde el ítem 33 el generador NO lee ficheros: le pregunta el catálogo al servidor de
      # terminología (D14, D15). Aquí, por tanto, hace falta uno — y tiene que ser **el del
      # `compose`**, no un doble: los tests de más arriba ya corren contra el arnés de
      # `tests/conftest.py`, así que un segundo doble no probaría nada nuevo, mientras que el HAPI
      # de verdad es lo único que puede desmentir al arnés si divergen.
      #
      # Se levantan solo `terminologia` y su cargador; el resto de la pila no hace falta y el
      # encadenado del `compose` trae postgres solo. Las dos claves de Keycloak son marcadores de
      # posición de servicios que este trabajo NO arranca: `docker compose` interpola el fichero
      # entero antes de elegir qué levantar, así que sin ellas ni se leería el YAML.
      - name: Levantar el servidor de terminología del compose
        run: |
          mkdir -p /tmp/releases-vacias
          cat > infra/compose/.env <<'EOF'
          HISPALIS_KEYCLOAK_ADMIN_CLAVE=ni-se-arranca-keycloak-en-esta-ci
          HISPALIS_KEYCLOAK_CLAVE_DEMO=ni-se-arranca-keycloak-en-esta-ci
          HISPALIS_RELEASES=/tmp/releases-vacias
          EOF
          docker compose -f infra/compose/docker-compose.yml up -d --build terminologia-carga
          # `wait` devuelve el código de salida del cargador, que es la condición correcta: lo que
          # importa no es que el servidor conteste, sino que tenga dentro el catálogo.
          docker compose -f infra/compose/docker-compose.yml wait terminologia-carga

      # LOINC, THO y SNOMED **no** se cargan aquí: viven fuera del repositorio y ninguna de las tres
      # se puede descargar en una CI —la del Ministerio ni siquiera se puede redistribuir—. El
      # cargador lo avisa en voz alta y carga el catálogo propio, que es lo único que el generador
      # necesita: el `display` de LOINC lo saca del `ConceptMap`, no de un `$lookup`. Que el
      # catálogo esté de verdad se comprueba **antes** de generar, porque un servidor arrancado y
      # vacío es la peor forma de estar disponible.
      # ⚠️ `count=1000`, y NO `count=0`. La norma dice que `count=0` devuelve solo el total, sin
      # códigos; HAPI lo lee como «máximo 0 códigos» y aborta con `HAPI-0831: produced too many
      # codes (maximum 0)`. Y solo lo hace mientras el `ValueSet` está `NOT_EXPANDED` —recién
      # cargado, que es siempre el caso aquí—, porque la pre-expansión toma otro camino. Contra un
      # servidor con el volumen de una ejecución anterior la misma llamada funciona: `adr-0026`.
      #
      # Se pregunta EXACTAMENTE como lo va a preguntar el generador, para que un fallo de la llamada
      # aparezca aquí y no tres pasos después disfrazado de catálogo vacío.
      - name: Comprobar que el catálogo está cargado
        run: |
          curl -sf --get "$HISPALIS_TERMINOLOGIA/ValueSet/\$expand" \
            --data-urlencode 'url=https://aojeda006.github.io/HispaLIS/fhir/ValueSet/pruebas-del-catalogo' \
            --data-urlencode 'count=1000' \
            | python3 -c 'import json,sys; n=len(json.load(sys.stdin)["expansion"].get("contains",[])); print(f"El catálogo oferta {n} pruebas."); sys.exit(0 if n else 1)'

      # Criterio de aceptación 11, la mitad que los tests no pueden afirmar por sí solos: que los
      # recursos generados sean CONFORMES a sus perfiles. Un test comprueba que el generador escribe
      # lo que cree que escribe; que eso sea válido según la especificación solo lo dice el
      # validador oficial.
      #
      # La fecha se fija para que el corpus validado sea siempre el mismo: sin ella, un fallo que
      # dependiera del día no se podría reproducir.
      #
      # Sesenta pacientes y no cuarenta, que son los mismos que usan los tests: medido con la semilla
      # 42 contra el servidor, con cuarenta salen CERO pruebas reflejas, y entonces el validador
      # oficial nunca llega a ver un `Observation.triggeredBy` — el elemento que R5 estrena y que más
      # falta hace comprobar contra la especificación. Un corpus que no contiene el caso no lo valida.
      - name: Generar un corpus sintético
        working-directory: simuladores
        run: python -m generador --seed 42 --pacientes 60 --fecha 2026-08-05 --salida corpus

      - name: Validar el corpus contra los perfiles de la guía
        run: |
          java -jar validator_cli.jar simuladores/corpus/recursos \
            -version "$VERSION_FHIR" \
            -ig "$PAQUETE_FHIR" \
            -ig hl7.fhir.uv.tools.r5#1.1.2 \
            -ig ig/fsh-generated/resources \
            -recurse \
            -output-style compact

      - name: Publicar el corpus generado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simuladores-corpus
          path: simuladores/corpus/
          retention-days: 7
          if-no-files-found: ignore

      # `wait` no imprime nada, así que si el cargador falla el trabajo se para sin decir por qué.
      # Los logs salen siempre y del servidor también: la mitad de los fallos de carga son del HAPI
      # de abajo, no del cargador de arriba.
      - name: Los logs de la terminología
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml logs --no-color terminologia terminologia-carga

      - name: Recoger
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v
