# CI de la app del ciudadano (Flutter). Componente del hito 2.
# Filtrado por `paths:` OBLIGATORIO (§13.1 del diseño).
name: CI · app-ciudadano

on:
  push:
    branches: [main]
    paths:
      - 'app-ciudadano/**'
      - '.github/workflows/ci-app-ciudadano.yml'
  pull_request:
    paths:
      - 'app-ciudadano/**'
      - '.github/workflows/ci-app-ciudadano.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Analyze + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La guarda de auto-omisión que vivía aquí se retiró al andamiar la app (ítem 38). Un
      # `if:` que decide si se compila deja pasar en verde un componente que no se ha construido,
      # que es justo lo que un CI no debe hacer una vez el componente existe.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: app-ciudadano
        run: flutter pub get

      # `flutter analyze` falla también con los avisos de nivel `info`, y el
      # `analysis_options.yaml` de la app sube `public_member_api_docs` a error.
      - name: Analyze
        working-directory: app-ciudadano
        run: flutter analyze

      - name: Tests
        working-directory: app-ciudadano
        run: flutter test
