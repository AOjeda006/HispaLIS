# CI del motor de integración (canales HL7 V2.5.1 sobre MLLP). Componente del hito 2.
# Filtrado por `paths:` OBLIGATORIO (§13.1 del diseño).
name: CI · integracion

on:
  push:
    branches: [main]
    paths:
      - 'integracion/**'
      - '.github/workflows/ci-integracion.yml'
      # El motor depende del FSH de la guía por dos vías reales: un test cruza sus `system` de
      # identificador contra los alias, y el validador comprueba contra los perfiles el `Patient` que
      # el canal produce. Sin esta ruta, cambiar la guía no dispararía ninguna de las dos.
      - 'ig/input/fsh/**'
  pull_request:
    paths:
      - 'integracion/**'
      - '.github/workflows/ci-integracion.yml'
      - 'ig/input/fsh/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-integracion-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_FHIR: 5.0.0
  PAQUETE_FHIR: hl7.fhir.r5.core#5.0.0

jobs:
  verificar:
    name: Build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # SUSHI va ANTES del build, no después: el motor resuelve el catálogo contra un servidor de
      # terminología (D14), y el que levanta el arnés de los tests se carga con lo que produce SUSHI
      # —la terminología es una caja obligatoria, no un `Map<String,String>`—, así que sin este paso
      # los tests del canal ni siquiera arrancan. También deja compilados los perfiles que necesita
      # el validador al final.
      - name: Compilar la terminología y los perfiles de la guía
        working-directory: ig
        run: npx --yes fsh-sushi .

      # `verify` incluye la comprobación de formato de Spotless, enganchada a esa fase en el pom, y
      # levanta PostgreSQL en proceso, el listener MLLP con TLS y un servidor HTTP que hace de
      # laboratorio. El certificado del listener se genera en `target/` durante el propio build: no
      # hay ningún almacén de claves en el repositorio.
      - name: Build y tests
        working-directory: integracion
        run: ./mvnw --batch-mode verify

      - name: Descargar el validador oficial de HL7
        run: |
          curl -sSL -o validator_cli.jar \
            https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar

      # El canal deja en `target/canal/` lo que el motor envía al laboratorio: el `Patient` del ADT,
      # la línea y la muestra del OML y el resultado del ORU. Que el canal funcione y que lo que
      # produce sea CONFORME son dos cosas distintas: un mapeo v2 → FHIR puede ejecutarse entero y
      # producir un recurso que ningún servidor acepte.
      - name: Validar lo que el canal produce
        run: |
          java -jar validator_cli.jar integracion/target/canal \
            -version "$VERSION_FHIR" \
            -ig "$PAQUETE_FHIR" \
            -ig hl7.fhir.uv.tools.r5#1.1.2 \
            -ig ig/fsh-generated/resources \
            -recurse \
            -output-style compact

      - name: Publicar los informes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integracion-informes-test
          path: integracion/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
