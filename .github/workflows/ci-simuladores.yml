# CI de los simuladores y el generador de datos sintéticos (Python).
# Filtrado por `paths:` OBLIGATORIO (§13.1 del diseño).
name: CI · simuladores

on:
  push:
    branches: [main]
    paths:
      - 'simuladores/**'
      - '.github/workflows/ci-simuladores.yml'
  pull_request:
    paths:
      - 'simuladores/**'
      - '.github/workflows/ci-simuladores.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-simuladores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: simuladores/pyproject.toml

      - name: Instalar dependencias
        working-directory: simuladores
        run: python -m pip install -e ".[dev]"

      - name: Lint y formato
        working-directory: simuladores
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        working-directory: simuladores
        run: pytest
