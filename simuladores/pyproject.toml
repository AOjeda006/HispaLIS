[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hispalis-simuladores"
version = "0.1.0"
description = "Generador de datos sintéticos y simuladores de HIS y analizador de HispaLIS"
readme = "README.md"
requires-python = ">=3.11"
license = "CC0-1.0"
authors = [{ name = "Andrés Ojeda Rodríguez", email = "andresojedarodriguez@gmail.com" }]
# Faker aporta la localización española (nombres de pila, viario). El rango está acotado por arriba
# a propósito: sus corpus cambian entre versiones mayores, y la salida del generador tiene que ser
# reproducible —es un arnés de carga, no solo un juego de datos—. Sin la cota, una versión nueva de
# Faker cambiaría la salida con la misma semilla y nadie sabría por qué.
dependencies = ["faker>=40,<41"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
generador = "generador.__main__:main"
his = "his.__main__:main"
analizador = "analizador.__main__:main"
receptor = "receptor.__main__:main"

[tool.setuptools]
# `mllp` es el transporte, compartido por los dos simuladores: el HIS y el analizador son sistemas
# distintos que hablan el mismo sobre, y que uno importara del otro modelaría mal esa relación.
packages = ["generador", "his", "analizador", "mllp", "receptor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
