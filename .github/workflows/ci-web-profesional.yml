# CI de la web profesional (Angular).
# Filtrado por `paths:` OBLIGATORIO (§13.1 del diseño).
name: CI · web-profesional

on:
  push:
    branches: [main]
    paths:
      - 'web-profesional/**'
      - '.github/workflows/ci-web-profesional.yml'
      # La web ofrece las pruebas del MISMO `CodeSystem` que publica la guía (D15) y cruza sus
      # `Identifier.system` contra `aliases.fsh`. Sin esta ruta, añadir una prueba al catálogo o
      # cambiar un `system` no dispararía los tests que detectan justamente eso.
      - 'ig/input/fsh/**'
  pull_request:
    paths:
      - 'web-profesional/**'
      - '.github/workflows/ci-web-profesional.yml'
      - 'ig/input/fsh/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Angular 22 declara `engines.node: ^22.22.3 || ^24.15.0 || >=26.0.0`. Con Node 20 la
      # instalación falla, así que esta versión no es intercambiable: se sube junto con Angular.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-profesional/package-lock.json

      # El catálogo de pruebas que ofrece la pantalla de alta no está versionado: lo produce SUSHI a
      # partir del FSH, y `npm run build` lo trae con `scripts/traer-terminologia.mjs`. NO se
      # construye la IG entera —eso es cosa de `ci-ig` y cuesta minutos—: los artefactos de
      # conformidad salen en segundos.
      - name: Compilar la terminología de la guía
        working-directory: ig
        run: npx --yes fsh-sushi .

      - name: Instalar dependencias
        working-directory: web-profesional
        run: npm ci

      - name: Lint y formato
        working-directory: web-profesional
        run: npm run lint

      # El proyecto usa el ejecutor por defecto de Angular 22: vitest sobre jsdom, no Karma. Por eso
      # no lleva `--browsers=ChromeHeadless`, que es sintaxis de Karma y aquí haría fallar la orden.
      - name: Tests
        working-directory: web-profesional
        run: npm test

      - name: Build
        working-directory: web-profesional
        run: npm run build
