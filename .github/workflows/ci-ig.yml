# CI de la guía de implementación (ig/): compila el FSH, construye la IG, valida los ejemplos
# con el validador oficial de HL7 contra hl7.fhir.r5.core@5.0.0 y publica a GitHub Pages.
#
# El filtrado por `paths:` es OBLIGATORIO en este monorepo (§13.1 del diseño): sin él, un cambio en
# Flutter recompilaría el backend.
name: CI · IG

on:
  push:
    branches: [main]
    paths:
      - 'ig/**'
      - '.github/workflows/ci-ig.yml'
  pull_request:
    paths:
      - 'ig/**'
      - '.github/workflows/ci-ig.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-ig-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_FHIR: 5.0.0
  PAQUETE_FHIR: hl7.fhir.r5.core#5.0.0

jobs:
  construir-ig:
    name: Compilar FSH, construir la IG y validar los ejemplos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # El IG Publisher genera el HTML con Jekyll, que NO viene en el runner. Sin esto, la
      # construcción llega hasta el final de la fase FHIR y muere al renderizar las páginas.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Instalar Jekyll
        run: gem install jekyll

      - name: Instalar SUSHI
        run: npm install -g fsh-sushi

      - name: Compilar el FSH
        working-directory: ig
        run: sushi .

      - name: Cachear los paquetes FHIR
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('ig/sushi-config.yaml') }}
          restore-keys: fhir-packages-

      - name: Descargar el IG Publisher
        run: |
          curl -sSL -o ig/publisher.jar \
            https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar

      - name: Construir la IG
        working-directory: ig
        run: java -Xmx4g -jar publisher.jar -ig . -no-sushi

      # Criterio de aceptación 2 (§14): ningún recurso de ejemplo sale del pipeline sin validar
      # contra su perfil, con el validador OFICIAL y la versión FIJADA.
      - name: Descargar el validador oficial de HL7
        run: |
          curl -sSL -o validator_cli.jar \
            https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar

      # Criterio de aceptación 2, literalmente: TODO perfil necesita al menos un ejemplo. No basta
      # con que existan ejemplos sueltos — se comprueba perfil por perfil, cruzando cada
      # StructureDefinition con los `meta.profile` de las instancias.
      - name: Comprobar que cada perfil tiene ejemplo
        run: |
          python3 - <<'PY'
          import glob, json, sys

          perfiles, declarados = {}, set()
          for ruta in glob.glob("ig/fsh-generated/resources/*.json"):
              with open(ruta, encoding="utf-8") as f:
                  r = json.load(f)
              if (r.get("resourceType") == "StructureDefinition"
                      and r.get("derivation") == "constraint"
                      and r.get("type") != "Extension"):
                  perfiles[r["url"]] = r["id"]
              declarados.update(r.get("meta", {}).get("profile", []))

          if not perfiles:
              print("::notice::La IG todavía no define perfiles; no hay ejemplos que validar.")
              sys.exit(0)

          sin_ejemplo = sorted(i for u, i in perfiles.items() if u not in declarados)
          if sin_ejemplo:
              for i in sin_ejemplo:
                  print(f"::error::El perfil «{i}» no tiene ningún ejemplo que lo declare en meta.profile.")
              print(f"::error::{len(sin_ejemplo)} de {len(perfiles)} perfiles se quedan sin ejemplo (criterio de aceptación 2).")
              sys.exit(1)

          print(f"Los {len(perfiles)} perfiles tienen al menos un ejemplo.")
          PY

      # Los ejemplos se escriben en FSH, así que lo que hay que validar es lo que SUSHI genera, no
      # una carpeta de JSON a mano. Se valida el paquete entero: las instancias contra el perfil que
      # declaran en `meta.profile`, y de paso los propios artefactos de conformidad.
      - name: Validar los ejemplos contra sus perfiles
        run: |
          java -jar validator_cli.jar ig/fsh-generated/resources \
            -version "$VERSION_FHIR" \
            -ig "$PAQUETE_FHIR" \
            -ig hl7.fhir.uv.tools.r5#1.1.2 \
            -ig ig/output/package.tgz \
            -recurse \
            -output-style compact

      - name: Publicar la IG construida como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ig-output
          path: ig/output/
          retention-days: 7

      - name: Preparar el artefacto de GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ig/output/

  publicar:
    name: Publicar la IG en GitHub Pages
    needs: construir-ig
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      # Dar de alta Pages desde el propio workflow NO es posible: `configure-pages` con
      # `enablement: true` llama a la API de Pages, que exige un token con scope `repo`, y el
      # GITHUB_TOKEN no lo tiene. Se comprueba y se falla con el paso concreto que hay que dar, en
      # vez de morir con un error de la acción que no dice qué hacer.
      - name: Comprobar que GitHub Pages está habilitado
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$codigo" = "404" ]; then
            echo "::error::GitHub Pages no está habilitado. Actívalo en Settings → Pages → Build and deployment → Source: «GitHub Actions». No se puede hacer desde aquí: la API de Pages exige un token con scope repo y el GITHUB_TOKEN no lo tiene."
            exit 1
          fi
          echo "GitHub Pages habilitado (HTTP $codigo)."

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
