# CI del backend (dominio + API FHIR R5 + proyección HAPI).
# Filtrado por `paths:` OBLIGATORIO (§13.1 del diseño).
name: CI · backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
      # El backend declara en su `CapabilityStatement` los perfiles de la guía, y un test cruza esa
      # lista contra el FSH para que no diverjan. Sin esta ruta, añadir un perfil a la guía no
      # dispararía el test que detecta justamente eso.
      - 'ig/input/fsh/profiles/**'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
      # El backend declara en su `CapabilityStatement` los perfiles de la guía, y un test cruza esa
      # lista contra el FSH para que no diverjan. Sin esta ruta, añadir un perfil a la guía no
      # dispararía el test que detecta justamente eso.
      - 'ig/input/fsh/profiles/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` incluye la comprobación de formato de Spotless, enganchada a esa fase en el pom: el
      # formato se exige con el mismo comando que corre los tests, sin una orden aparte que olvidar.
      - name: Build y tests
        working-directory: backend
        run: ./mvnw --batch-mode verify

      - name: Publicar los informes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-informes-test
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
