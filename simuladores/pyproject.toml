[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hispalis-simuladores"
version = "0.1.0"
description = "Generador de datos sintéticos y simuladores de HIS y analizador de HispaLIS"
readme = "README.md"
requires-python = ">=3.11"
license = "CC0-1.0"
authors = [{ name = "Andrés Ojeda Rodríguez", email = "andresojedarodriguez@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
generador = "generador.__main__:main"

[tool.setuptools]
packages = ["generador"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
