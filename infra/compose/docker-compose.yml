# La pila entera: PostgreSQL + Kafka + registro de esquemas + terminología + Keycloak + backend +
# motor de integración + web.
#
#   cp infra/compose/.env.example infra/compose/.env   # y edítalo
#   docker compose -f infra/compose/docker-compose.yml up -d
#
# Todo lo que hace falta para recorrer el circuito de extremo a extremo desde un clon recién hecho,
# con **un solo comando**. Fuera del compose queda solo lo que representa a un tercero: el HIS
# simulado y el analizador, que se arrancan a mano porque son los sistemas del hospital y del
# laboratorio, no parte de HispaLIS.
#
# ⚠️ Tres cosas viven FUERA del repositorio y hay que tenerlas antes de levantar:
#
#   1. La guía compilada — `npx fsh-sushi .` dentro de `ig/`. No se versiona: la produce SUSHI.
#   2. Las releases de terminología archivadas en `BibliotecaDocumentacion`, que se asume clonada
#      como carpeta hermana. Con `HISPALIS_RELEASES` se puede apuntar a otro sitio.
#   3. Un `.env` con las contraseñas de Keycloak. No hay valores por defecto a propósito: son
#      secretos de verdad y `.env` está en `.gitignore`. La plantilla es `.env.example`.
#
# Sin la primera o la segunda, el servidor de terminología levanta y el cargador para con un mensaje
# que dice cuál falta — que es mejor que un laboratorio arrancando con un catálogo vacío. Sin la
# tercera, `docker compose` para antes de crear nada y dice qué variable falta.

name: hispalis

services:
  postgres:
    # 14 y no la última: es la versión con la que corren los tests del backend (PostgreSQL embebido),
    # y las dos tienen que moverse juntas. Con versiones distintas, una migración que use algo de
    # PG15 pasaría aquí y fallaría en los tests — ya ocurrió una vez, con `NULLS NOT DISTINCT`.
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: hispalis
      POSTGRES_USER: hispalis
      # Es una simulación con datos sintéticos y la base no se publica fuera de la red del compose.
      # En cualquier otro sitio esto sería un secreto, no una línea en un fichero versionado.
      POSTGRES_PASSWORD: hispalis
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      # Crea la base del servidor de terminología. Solo corre la primera vez que se inicializa el
      # volumen: sobre una pila que ya existía hay que hacer `down -v`.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hispalis -d hispalis']
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # KRaft, sin ZooKeeper: es lo que Kafka 3.9 recomienda y lo único que existe en Kafka 4.
    # La versión acompaña a la del cliente que usa el backend (§12): cliente y broker se mueven
    # juntos o el protocolo deja de entenderse.
    image: confluentinc/cp-kafka:7.9.8
    environment:
      CLUSTER_ID: hispalis-kraft-000000000
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Dos escuchas porque hay dos redes: `INTERNA` es por donde entra el backend desde dentro del
      # compose y `LOCAL` la que se publica al equipo. Con una sola, el broker anunciaría a los
      # clientes de fuera una dirección que solo existe dentro — el fallo clásico de Kafka en Docker,
      # que además no aparece al conectar sino al pedir metadatos.
      KAFKA_LISTENERS: 'INTERNA://kafka:9092,LOCAL://0.0.0.0:29092,CONTROLLER://kafka:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNA://kafka:9092,LOCAL://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNA:PLAINTEXT,LOCAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNA
      # Un solo nodo: todo lo que por defecto asume tres réplicas hay que bajarlo a una.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Los tópicos los crea `kafka-topics` con sus particiones y su retención. Con la creación
      # automática encendida, un tópico mal escrito en un cliente nacería solo, con una partición y
      # la configuración por defecto, y nadie se enteraría hasta que el orden dejara de cumplirse.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    ports:
      - '29092:29092'
    volumes:
      - datos-kafka:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'kafka:9092']
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 20

  # Los cuatro tópicos de §11, creados una vez y con su configuración explícita. Es un servicio de
  # arranque, no un demonio: crea y termina, y quien depende de él espera a que termine bien.
  kafka-topicos:
    image: confluentinc/cp-kafka:7.9.8
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -euo pipefail
        for topico in lab.peticiones.v1 lab.especimenes.v1 lab.resultados.v1 lab.informes.v1; do
          # Tres particiones para que la clave de reparto —el paciente— signifique algo: con una
          # sola, el orden saldría bien por accidente y nadie notaría que la clave está mal puesta.
          # `--if-not-exists` porque este servicio vuelve a correr en cada `up`.
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topico" --partitions 3 --replication-factor 1 \
            --config retention.ms=604800000
        done
        kafka-topics --bootstrap-server kafka:9092 --list

  registro-de-esquemas:
    image: confluentinc/cp-schema-registry:7.9.8
    environment:
      SCHEMA_REGISTRY_HOST_NAME: registro-de-esquemas
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:9092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8085'
      # Compatibilidad hacia atrás, que es lo que exige §11. Es además el valor por defecto de
      # Confluent, y se escribe igual: un contrato que depende de un valor por defecto es un
      # contrato que se pierde el día que alguien cambie la imagen.
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    ports:
      - '8085:8085'
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8085/subjects']
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 20

  # ─── Terminología (D14) ────────────────────────────────────────────────────
  #
  # Un `hapi-fhir-jpaserver-starter` de serie: la imagen NO se construye. Todo lo nuestro entra por
  # la API estándar, así que este servicio es reemplazable por Snowstorm u Ontoserver cambiando la
  # URL que usan el backend, el motor y el generador — y nada más.
  # Un volumen recién creado es de `root`, y la imagen de HAPI corre sin privilegios (65532). Sin
  # esto el servidor arranca, crea sus tablas y muere al montar el índice con un
  # `AccessDeniedException: /datos/lucene` enterrado en cien líneas de traza. Se arregla aquí y no
  # con `user: root` en el servicio: darle privilegios al servidor para que pueda escribir en un
  # directorio es cambiar el problema de sitio.
  terminologia-datos:
    image: busybox:1.37
    command: ['sh', '-c', 'mkdir -p /datos/lucene && chown -R 65532:65532 /datos']
    volumes:
      - datos-terminologia:/datos

  terminologia:
    image: hapiproject/hapi:v8.10.0-3
    environment:
      # Medido: con el ajuste por defecto, el servidor muere en silencio (código 255, sin traza)
      # justo al cargar en memoria los paquetes de R5. No es un cuelgue: es que no le cabe.
      JAVA_OPTS: '-Xmx4g -Xms512m'
      HISPALIS_TERMINOLOGIA_BD: jdbc:postgresql://postgres:5432/terminologia
      HISPALIS_TERMINOLOGIA_BD_USUARIO: hispalis
      HISPALIS_TERMINOLOGIA_BD_CLAVE: hispalis
      HISPALIS_TERMINOLOGIA_PUBLICA: http://localhost:8086/fhir
    volumes:
      - ../../terminologia/hapi/application.yaml:/app/config/application.yaml:ro
      - datos-terminologia:/datos
    ports:
      - '8086:8080'
    depends_on:
      postgres:
        condition: service_healthy
      terminologia-datos:
        condition: service_completed_successfully
    # Sin `healthcheck`, y no por descuido: la imagen de HAPI es *distroless* —solo lleva `java`—,
    # así que un `test: [CMD, curl, …]` no falla por estar el servidor mal, falla por no existir
    # `curl`, y el servicio se queda «unhealthy» con el log en verde. Quien espera a la terminología
    # espera al cargador, que es además la condición correcta: lo que importa no es que el servidor
    # conteste, sino que tenga dentro el catálogo.

  # Servicio de arranque, como `kafka-topicos`: carga y termina. Quien necesita terminología espera
  # a que TERMINE BIEN, no a que el servidor conteste — un servidor levantado y vacío responde
  # `$validate-code` con «no» a todo, que es la peor forma de estar disponible.
  terminologia-carga:
    build:
      context: ../..
      dockerfile: terminologia/Dockerfile
    environment:
      HISPALIS_TERMINOLOGIA: http://terminologia:8080/fhir
      # Sin la Edición Española no se carga SNOMED y el cargador lo avisa. No se puede
      # redistribuir, así que no hay valor por defecto que pueda funcionar por accidente.
      HISPALIS_SNOMED: ${HISPALIS_SNOMED:-}
    volumes:
      # La guía compilada: lo que produce SUSHI, que no está versionado.
      - ../../ig/fsh-generated/resources:/guia:ro
      # Las releases archivadas, FUERA del repositorio y en solo lectura.
      - ${HISPALIS_RELEASES:-../../../BibliotecaDocumentacion/_fuente/_externos}:/releases:ro
    depends_on:
      terminologia:
        condition: service_started

  # ─── Identidad (ítem 34) ───────────────────────────────────────────────────
  #
  # El realm entra por `--import-realm` desde `infra/keycloak/`: configuración COMO CÓDIGO. Nada de
  # esto se toca en la consola de administración — un realm clicado a mano no se revisa, no se
  # despliega y no se puede reconstruir tras un `down -v`.
  #
  # ⚠️ Las dos contraseñas son OBLIGATORIAS y no tienen valor por defecto. Es deliberado: aquí sí hay
  # secretos de verdad —la cuenta de administración del servidor de identidad y las de los usuarios
  # de demostración—, y un valor por defecto en un fichero versionado es la forma habitual de que un
  # secreto acabe en producción. Cópiate `.env.example` a `.env` (que está en `.gitignore`).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${HISPALIS_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${HISPALIS_KEYCLOAK_ADMIN_CLAVE:?falta HISPALIS_KEYCLOAK_ADMIN_CLAVE — copia infra/compose/.env.example a .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: hispalis
      KC_DB_PASSWORD: hispalis
      KC_HEALTH_ENABLED: 'true'
      # El emisor que ve el navegador y el que ve el backend tienen que ser EL MISMO literal: el
      # `iss` del testigo se compara con el configurado, y `keycloak:8080` frente a `localhost:8081`
      # son dos emisores distintos aunque sean el mismo servidor. Con el nombre de anfitrión fijado
      # aquí, Keycloak firma y anuncia siempre `http://localhost:8081`, y el backend lo alcanza por
      # ese mismo nombre gracias al `extra_hosts` de abajo.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'false'
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    ports:
      - '8081:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # La imagen de Keycloak tampoco lleva `curl`, pero sí trae un JRE: el propio Keycloak publica
      # `/health/ready` en el puerto de administración (9000) y se consulta con `java`.
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30

  # Lo que no puede ir en el realm versionado porque son secretos: las contraseñas de los usuarios de
  # demostración. Servicio de arranque, como `kafka-topicos`: pone y termina.
  keycloak-usuarios:
    image: quay.io/keycloak/keycloak:26.4
    entrypoint: ['/bin/bash', '-c']
    environment:
      KC_ADMIN: ${HISPALIS_KEYCLOAK_ADMIN:-admin}
      KC_ADMIN_CLAVE: ${HISPALIS_KEYCLOAK_ADMIN_CLAVE:?falta HISPALIS_KEYCLOAK_ADMIN_CLAVE}
      KC_CLAVE_DEMO: ${HISPALIS_KEYCLOAK_CLAVE_DEMO:?falta HISPALIS_KEYCLOAK_CLAVE_DEMO — copia infra/compose/.env.example a .env}
    command:
      - |
        set -euo pipefail
        kcadm=/opt/keycloak/bin/kcadm.sh
        $$kcadm config credentials --server http://keycloak:8080 --realm master \
          --user "$$KC_ADMIN" --password "$$KC_ADMIN_CLAVE"
        for usuario in dra.alvarez paciente.demo paciente.otro; do
          id=$$($$kcadm get users -r hispalis -q username=$$usuario -q exact=true --fields id --format csv --noquotes)
          $$kcadm set-password -r hispalis --userid "$$id" --new-password "$$KC_CLAVE_DEMO"
          echo "contraseña puesta a $$usuario"
        done
    depends_on:
      keycloak:
        condition: service_healthy

  backend:
    build:
      # El contexto es la raíz del repositorio, compartido con la web.
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      HISPALIS_BD_URL: jdbc:postgresql://postgres:5432/hispalis
      HISPALIS_BD_USUARIO: hispalis
      HISPALIS_BD_CLAVE: hispalis
      HISPALIS_KAFKA: 'kafka:9092'
      HISPALIS_REGISTRO_ESQUEMAS: 'http://registro-de-esquemas:8085'
      HISPALIS_TERMINOLOGIA: 'http://terminologia:8080/fhir'
      # El emisor PÚBLICO: es el `iss` que firma Keycloak, el que el backend valida y el que publica
      # a los clientes. Tiene que ser el que ve el navegador.
      HISPALIS_OIDC_EMISOR: 'http://localhost:8081/realms/hispalis'
      # Y por dónde llega el backend, que no es lo mismo. Dentro de un contenedor `localhost` es el
      # propio contenedor, y un `extra_hosts: localhost:host-gateway` NO lo arregla: `/etc/hosts` ya
      # trae `127.0.0.1 localhost` en la primera línea y gana. Se validó `extra_hosts` así durante
      # una tanda entera y no funcionó hasta que se levantó la pila completa.
      HISPALIS_OIDC_INTERNO: 'http://keycloak:8080/realms/hispalis'
      # Las bases FHIR por las que se llega a este mismo servidor. El navegador entra por el proxy
      # (`:4200`) y el motor por la red interna (`backend:8080`), así que el `aud` legítimo de un
      # testigo es uno u otro según quién lo pidiera. Fuera de una pila de desarrollo hay una sola.
      HISPALIS_OIDC_AUDIENCIAS: 'http://localhost:4200/fhir,http://localhost:8080/fhir,http://backend:8080/fhir'
      # La base por la que el receptor de una notificación puede resolver sus referencias. No se
      # deduce de la petición porque el relay no atiende ninguna: entrega desde un hilo de fondo.
      HISPALIS_BASE_FHIR: 'http://localhost:8080/fhir'
      # El secreto con el que se FIRMA la notificación saliente. Nunca va dentro del recurso
      # `Subscription`, que se lee por la API: ahí solo va el identificador de la clave.
      HISPALIS_CLAVE_HIS: ${HISPALIS_CLAVE_HIS:-}
    ports:
      # Se publica aunque la web no lo necesite —le llega por el proxy—, porque el circuito se
      # recorre con `curl` y el validador oficial también entra por aquí.
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      # El bus NO condiciona el arranque de la API: para eso está el outbox. Lo que sí se espera es
      # a que existan los tópicos, porque si el backend arrancara antes, el relay publicaría contra
      # un tópico inexistente y se pasaría los primeros segundos reintentando para nada.
      kafka-topicos:
        condition: service_completed_successfully
      registro-de-esquemas:
        condition: service_healthy
      # La terminología SÍ condiciona el arranque, al revés que el bus: el laboratorio valida
      # códigos y resuelve `display` contra ella desde la primera escritura, y arrancar antes de
      # que esté cargada significaría publicar unos recursos con `display` y otros sin él.
      terminologia-carga:
        condition: service_completed_successfully
      # La identidad ordena el arranque pero NO lo condiciona en el fondo: el backend levanta con
      # Keycloak caído y descubre sus claves en la primera petición que traiga testigo. Sin él la API
      # contesta 401 a todo, que es lo correcto — pero no se queda sin arrancar.
      keycloak-usuarios:
        condition: service_completed_successfully
    healthcheck:
      # `metadata` es la prueba honesta de que está listo: contesta cuando el servidor FHIR está
      # levantado de verdad, no cuando el proceso existe.
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/fhir/metadata']
      interval: 10s
      timeout: 5s
      # HAPI JPA tarda en el primer arranque: crea su centenar de tablas y Flyway migra las nuestras.
      start_period: 120s
      retries: 30

  # ─── Motor de integración (D4, D5) ─────────────────────────────────────────
  #
  # El certificado del *listener* MLLP se genera **al levantar**, no se versiona. Un almacén PKCS#12
  # con su clave privada dentro de un repositorio es una clave publicada, y da igual que sea de
  # desarrollo: el día que alguien copie el patrón para producción, copiará también el fichero.
  # Servicio de arranque, como `kafka-topicos`: genera y termina.
  motor-claves:
    image: eclipse-temurin:21-jre
    entrypoint: ['/bin/sh', '-c']
    environment:
      MLLP_CLAVE: ${HISPALIS_MLLP_CLAVE:-hispalis}
    command:
      - |
        set -eu
        if [ -s /claves/mllp.p12 ]; then
          echo "el almacén MLLP ya existe; no se toca"
          exit 0
        fi
        keytool -genkeypair -alias mllp -keyalg RSA -keysize 3072 -validity 365 \
          -dname "CN=motor, OU=HispaLIS, O=Laboratorio Clinico, L=Sevilla, C=ES" \
          -ext "SAN=dns:motor,dns:localhost,ip:127.0.0.1" \
          -keystore /claves/mllp.p12 -storetype PKCS12 \
          -storepass "$$MLLP_CLAVE" -keypass "$$MLLP_CLAVE"
        # El motor corre sin privilegios (uid 10002) y tiene que poder leerlo.
        chmod 0644 /claves/mllp.p12
        echo "almacén MLLP generado"
    volumes:
      - claves-motor:/claves

  motor:
    build:
      context: ../..
      dockerfile: integracion/Dockerfile
    environment:
      # Esquema propio dentro de la misma instancia: comparte servidor, no datos (D5).
      HISPALIS_BD_URL: jdbc:postgresql://postgres:5432/hispalis
      HISPALIS_BD_USUARIO: hispalis
      HISPALIS_BD_CLAVE: hispalis
      # El motor escribe por la API FHIR como un cliente más, nunca contra la base del laboratorio.
      HISPALIS_API_FHIR: 'http://backend:8080/fhir'
      HISPALIS_TERMINOLOGIA: 'http://terminologia:8080/fhir'
      # Mismo literal que el que firma Keycloak y que valida el backend: si no coinciden, el `iss`
      # del testigo no cuadra y el laboratorio lo rechaza aunque el testigo sea legítimo. El `aud` de
      # la aserción del motor sigue siendo el `token_endpoint` anunciado desde aquí.
      HISPALIS_OIDC_EMISOR: 'http://localhost:8081/realms/hispalis'
      # Y por dónde va el motor a buscarlo, que no es lo mismo (ver el backend).
      HISPALIS_OIDC_INTERNO: 'http://keycloak:8080/realms/hispalis'
      # Sin `HISPALIS_MOTOR_CLAVE`: el motor genera una clave efímera al arrancar y publica su JWKS
      # en `/motor/jwks.json`, que es la URL que el realm tiene registrada. Keycloak la va a buscar
      # por la red interna del compose. Al reiniciar el motor, la clave cambia y Keycloak la vuelve
      # a leer — que es justo lo que se quería demostrar al registrarla por URL y no pegada.
      HISPALIS_MLLP_ALMACEN: /claves/mllp.p12
      HISPALIS_MLLP_CLAVE: ${HISPALIS_MLLP_CLAVE:-hispalis}
      # A dónde manda el motor el ORU^R01 de cada informe emitido. El HIS simulado corre FUERA del
      # compose —es el sistema del hospital, no nuestro—, así que se le apunta al equipo. Si no está
      # arrancado, el hecho se anota FALLIDO con su motivo y no se reintenta solo: es lo correcto.
      #
      # `host.docker.internal` y no `localhost`: un alias para `localhost` es imposible de añadir
      # —`/etc/hosts` ya lo resuelve a 127.0.0.1 en la primera línea—, y este nombre no está, así que
      # el `extra_hosts` de abajo sí surte efecto.
      HISPALIS_HIS_SERVIDOR: host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      # Solo el MLLP. La consola del motor (8082) se queda DENTRO de la red del compose: todavía no
      # tiene autenticación, y una bandeja de errores con referencias a pacientes no se publica.
      - '2575:2575'
    volumes:
      - claves-motor:/claves:ro
    depends_on:
      postgres:
        condition: service_healthy
      motor-claves:
        condition: service_completed_successfully
      # El laboratorio SÍ condiciona: el motor escribe por su API desde el primer mensaje que reciba.
      backend:
        condition: service_healthy
      # Y la identidad también, porque el motor se identifica antes de escribir (D5).
      keycloak:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: web-profesional/Dockerfile
    ports:
      - '4200:80'
    depends_on:
      backend:
        condition: service_healthy

  # ─── Receptor de notificaciones (ítem 44) ──────────────────────────────────
  #
  # ⚠️ Va DETRÁS DE UN PERFIL, y es la primera vez que este `compose` usa uno. Con este servicio la
  # pila llegaría a doce, y el prerrequisito del hito 3 dice que a partir de once se reparte con
  # perfiles en vez de seguir creciendo. Se levanta a propósito:
  #
  #   docker compose --profile notificaciones up -d receptor
  #
  # Además es lo correcto por otra razón: este NO es un componente del laboratorio. Es el sistema
  # del hospital, y tenerlo levantado siempre daría a entender que el laboratorio depende de que
  # esté — y no depende: si no está, la notificación se reintenta y la suscripción se corta.
  receptor:
    profiles: ['notificaciones']
    build:
      context: ../..
      dockerfile: simuladores/Dockerfile
    environment:
      # Sin clave el receptor no arranca, y lo dice él: aceptar sin firma es aceptar de cualquiera.
      # Es la MISMA que el backend tiene en `HISPALIS_CLAVE_HIS`, porque eso es un secreto compartido.
      #
      # ⚠️ Aquí NO se usa `${VAR:?...}` como en las contraseñas de Keycloak, y la diferencia importa:
      # la interpolación se resuelve al LEER el fichero, no al levantar el servicio, así que un `:?`
      # en un servicio con perfil rompe `docker compose` entero —incluido `up`, `ps` y `config`— para
      # quien nunca vaya a usar ese perfil. Y peor: `.env.example` deja la clave vacía, y `:?` falla
      # también con valor vacío, así que un clon recién copiado no levantaría nada. Comprobado.
      HISPALIS_CLAVE_HIS: ${HISPALIS_CLAVE_HIS:-}
    ports:
      # Se publica para poder mirar el log y para probarlo con `curl` desde el equipo.
      - '8090:8090'

volumes:
  # El almacén PKCS#12 del listener MLLP, generado al levantar y nunca versionado.
  claves-motor:
  datos-postgres:
  # El log de Kafka sobrevive a un `down`: sin volumen, parar la pila borraría lo publicado y el
  # `_schemas` del registro con ello, que es donde vive el historial de versiones de los contratos.
  datos-kafka:
  # El índice de texto completo del servidor de terminología. Vive en disco y no en la base, así
  # que sin volumen habría que reindexar en cada arranque — y hasta entonces `$expand` iría vacío.
  datos-terminologia:
