# La web y la API se sirven del MISMO ORIGEN. No es una comodidad: es lo que evita CORS, lo que
# permite que el cliente use rutas relativas y lo que hará que el token del hito 2 no viaje entre
# dominios.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # UTF-8 explícito: la web muestra MUÑOZ y PEÑA, y un charset por defecto los rompe en la última
    # pulgada del camino, cuando el dato ha llegado bien de la base de datos hasta aquí.
    charset utf-8;

    location /fhir {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # ⚠️ Estas dos cabeceras NO son decorativas. El servidor firma
        # `Bundle.link[relation=next]` con la dirección por la que le llegó la petición, así que sin
        # ellas la página siguiente apuntaría a `http://backend:8080/fhir?…` — un nombre que solo
        # resuelve dentro de la red del compose y que el navegador no puede alcanzar. El cliente no
        # puede corregirlo, porque para él esa URL es opaca: el fallo aparecería solo al pasar de la
        # primera página.
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Un informe con muchos resultados tarda más que el defecto de 60s en el primer arranque,
        # cuando HAPI aún está calentando sus cachés.
        proxy_read_timeout 120s;
    }

    # El servidor de terminología, por el mismo origen y por el mismo motivo que la API.
    #
    # Lo que se expone es un servidor de terminología FHIR con su API estándar, y lo que la web le
    # pide es `$expand` del ValueSet del catálogo. No lleva PHI: son códigos de pruebas y sus nombres,
    # que es información pública de cualquier laboratorio. Aun así se publica **solo por aquí** y el
    # servicio no abre puerto propio hacia fuera del compose.
    #
    # Las barras finales de las dos líneas son la diferencia entre que funcione y que no:
    # `/terminologia/ValueSet/$expand` tiene que llegar al servidor como `/fhir/ValueSet/$expand`.
    location /terminologia/ {
        proxy_pass http://terminologia:8080/fhir/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # La primera expansión después de arrancar tarda: HAPI monta su índice de texto completo.
        proxy_read_timeout 120s;
    }

    # La web es una SPA: cualquier ruta que no sea un fichero la resuelve el enrutador de Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
