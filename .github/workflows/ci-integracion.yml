# CI del motor de integración (canales HL7 V2.5.1 sobre MLLP). Componente del hito 2.
# Filtrado por `paths:` OBLIGATORIO (§13.1 del diseño).
name: CI · integracion

on:
  push:
    branches: [main]
    paths:
      - 'integracion/**'
      - '.github/workflows/ci-integracion.yml'
  pull_request:
    paths:
      - 'integracion/**'
      - '.github/workflows/ci-integracion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-integracion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` incluye la comprobación de formato de Spotless, enganchada a esa fase en el pom.
      - name: Build y tests
        working-directory: integracion
        run: ./mvnw --batch-mode verify

      - name: Publicar los informes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integracion-informes-test
          path: integracion/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
