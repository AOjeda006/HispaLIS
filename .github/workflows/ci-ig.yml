# CI de la guía de implementación (ig/): compila el FSH, construye la IG, valida los ejemplos
# con el validador oficial de HL7 contra hl7.fhir.r5.core@5.0.0 y publica a GitHub Pages.
#
# El filtrado por `paths:` es OBLIGATORIO en este monorepo (§13.1 del diseño): sin él, un cambio en
# Flutter recompilaría el backend.
name: CI · IG

on:
  push:
    branches: [main]
    paths:
      - 'ig/**'
      - '.github/workflows/ci-ig.yml'
  pull_request:
    paths:
      - 'ig/**'
      - '.github/workflows/ci-ig.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-ig-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_FHIR: 5.0.0
  PAQUETE_FHIR: hl7.fhir.r5.core#5.0.0

jobs:
  construir-ig:
    name: Compilar FSH, construir la IG y validar los ejemplos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # El IG Publisher genera el HTML con Jekyll, que NO viene en el runner. Sin esto, la
      # construcción llega hasta el final de la fase FHIR y muere al renderizar las páginas.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Instalar Jekyll
        run: gem install jekyll

      - name: Instalar SUSHI
        run: npm install -g fsh-sushi

      - name: Compilar el FSH
        working-directory: ig
        run: sushi .

      - name: Cachear los paquetes FHIR
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-packages-${{ hashFiles('ig/sushi-config.yaml') }}
          restore-keys: fhir-packages-

      - name: Descargar el IG Publisher
        run: |
          curl -sSL -o ig/publisher.jar \
            https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar

      - name: Construir la IG
        working-directory: ig
        run: java -Xmx4g -jar publisher.jar -ig . -no-sushi

      # Criterio de aceptación 2 (§14): ningún recurso de ejemplo sale del pipeline sin validar
      # contra su perfil, con el validador OFICIAL y la versión FIJADA.
      - name: Descargar el validador oficial de HL7
        run: |
          curl -sSL -o validator_cli.jar \
            https://github.com/hapifhir/org.hl7.fhir.core/releases/latest/download/validator_cli.jar

      # La exigencia se activa en cuanto la IG tiene perfiles: en ese momento, no tener ejemplos es
      # un error que detiene el build. Mientras la IG esté solo andamiada no hay nada que validar,
      # y fallar por ello sería ruido, no una salvaguarda.
      - name: Validar los ejemplos contra sus perfiles
        run: |
          perfiles=$(find ig/input/fsh -name '*.fsh' -not -name 'aliases.fsh' | wc -l)
          ejemplos=$(find ig/input/examples -type f -not -name '.gitkeep' | wc -l)

          if [ "$perfiles" -eq 0 ]; then
            echo "::notice::La IG todavía no define perfiles; no hay ejemplos que validar."
            exit 0
          fi

          if [ "$ejemplos" -eq 0 ]; then
            echo "::error::La IG define $perfiles artefactos FSH y no hay ningún ejemplo en ig/input/examples. Todo perfil necesita al menos un ejemplo que valide (criterio de aceptación 2)."
            exit 1
          fi

          java -jar validator_cli.jar ig/input/examples \
            -version "$VERSION_FHIR" \
            -ig "$PAQUETE_FHIR" \
            -ig ig/output/package.tgz \
            -recurse \
            -output-style compact

      - name: Publicar la IG construida como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ig-output
          path: ig/output/
          retention-days: 7

      - name: Preparar el artefacto de GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ig/output/

  publicar:
    name: Publicar la IG en GitHub Pages
    needs: construir-ig
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
